spring.application.name=customer
server.port=8081

# Default profile: PostgreSQL. Credentials injected via env vars; localhost defaults work outside Docker.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/customerdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:customer}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:customer}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
