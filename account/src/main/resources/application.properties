spring.application.name=account

# Customer-service base URL. In Docker: resolved by compose service name. Localhost default for local dev.
customer.service.base-url=${CUSTOMER_SERVICE_BASE_URL:http://localhost:8081}

# Default profile: PostgreSQL. Credentials injected via env vars; localhost defaults work outside Docker.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/accountdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:account}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:account}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
